<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - InvestPro</title>
  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(120deg, #eef2ff 0%, #f8fafc 100%);
      font-family: Inter, system-ui, Avenir, Helvetica, Arial, sans-serif;
      color: #1a202c;
      /* Remove flex alignment to prevent card from being hidden at top */
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
      padding: 0 1rem;
      margin: 2.5rem auto 0 auto; /* Add top margin to ensure card is visible */
    }
    .simple-header {
      background: #fff;
      box-shadow: 0 2px 8px rgba(99,102,241,0.08);
      padding: 1.25rem 0;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #e5e7eb;
    }
    .header-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }
    .simple-header .logo {
      font-size: 2rem;
      font-weight: 800;
      color: #6366F1;
      text-decoration: none;
      letter-spacing: 1px;
    }
    .back-link {
      color: #6B7280;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
    }
    .back-link:hover {
      background: #EEF2FF;
      color: #6366F1;
    }
    .auth-card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 24px rgba(99,102,241,0.12);
      padding: 2.5rem 2rem 2rem 2rem;
      border: 1px solid #e5e7eb;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 1rem;
    }
    .auth-title {
      font-size: 2.2rem;
      font-weight: 800;
      color: #6366F1;
      margin-bottom: 0.5rem;
      letter-spacing: 0.5px;
    }
    .auth-subtitle {
      color: #6B7280;
      font-size: 1.05rem;
      font-weight: 500;
    }
    .auth-link {
      text-align: center;
      margin-top: 1rem;
      color: #6B7280;
      font-size: 1rem;
    }
    .auth-link a {
      color: #6366F1;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }
    .auth-link a:hover {
      color: #4F46E5;
      text-decoration: underline;
    }
    .error-message {
      background: #FEE2E2;
      border: 1px solid #FCA5A5;
      color: #9F1239;
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.95rem;
      display: none;
    }
    .success-message {
      background: #D1FAE5;
      border: 1px solid #10B981;
      color: #065F46;
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.95rem;
      display: none;
    }
    .input-group {
      margin-bottom: 0.7rem;
      display: flex;
      flex-direction: column;
    }
    .input-label {
      font-size: 1rem;
      font-weight: 600;
      color: #6366F1;
      margin-bottom: 0.5rem;
      letter-spacing: 0.2px;
    }
    .input-field {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      font-size: 1.05rem;
      background: #f8fafc;
      color: #1a202c;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      box-shadow: 0 2px 8px rgba(99,102,241,0.04);
    }
    .input-field:focus {
      border-color: #6366F1;
      box-shadow: 0 2px 12px rgba(99,102,241,0.10);
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.85rem 0;
      font-size: 1.15rem;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg,#6366F1,#4F46E5);
      color: #fff;
      box-shadow: 0 2px 8px rgba(99,102,241,0.08);
      margin-top: 0.5rem;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      background: linear-gradient(135deg,#4F46E5,#6366F1);
      box-shadow: 0 4px 16px rgba(99,102,241,0.15);
    }
    .logo-circle {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg,#6366F1,#4F46E5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 0.5rem auto;
      color: #fff;
      font-size: 2rem;
      box-shadow: 0 2px 8px rgba(99,102,241,0.12);
    }
    .animate-card {
      animation: fadeInUp 0.8s cubic-bezier(.23,1.01,.32,1) 0.1s both;
    }
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(40px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .illustration {
      text-align: center;
      margin-bottom: 0.2rem;
    }
    @media (max-width: 768px) {
      .header-container { padding: 0 0.5rem; }
      .simple-header .logo { font-size: 1.5rem; }
      .back-link { font-size: 0.95rem; padding: 0.5rem 1rem; }
    }
    @media (max-width: 480px) {
      .header-container { padding: 0 0.2rem; }
      .simple-header .logo { font-size: 1.2rem; }
      .back-link { font-size: 0.9rem; padding: 0.5rem 0.75rem; }
      .back-link span { display: none; }
    }
    @media (max-width: 600px) {
      .auth-card {
        padding: 1.5rem 0.5rem;
      }
      .auth-title {
        font-size: 1.5rem;
      }
      .input-field {
        font-size: 1rem;
      }
      .btn {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <header class="simple-header">
    <div class="header-container">
      <a href="/" class="logo">InvestPro</a>
      <a href="/" class="back-link">
        <i class="fas fa-arrow-left"></i>
        <span>Back to Home</span>
      </a>
    </div>
  </header>
  <div class="auth-container">
    <div class="auth-card animate-card">
      <div class="auth-header">
        <div class="logo-circle">
          <i class="fas fa-user-plus"></i>
        </div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join thousands of successful investors</p>
      </div>
      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>
      <form id="signupForm">
        <div class="input-group">
          <label class="input-label" for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            class="input-field"
            placeholder="Enter your full name"
            required
          >
        </div>

        <div class="input-group">
          <label class="input-label" for="mobile">Mobile Number</label>
          <input
            type="tel"
            id="mobile"
            name="mobile"
            class="input-field"
            placeholder="Enter your mobile number"
            required
          >
        </div>

        <div class="input-group">
          <label class="input-label" for="altMobile">Alternative Mobile (Optional)</label>
          <input
            type="tel"
            id="altMobile"
            name="altMobile"
            class="input-field"
            placeholder="Enter alternative mobile number"
          >
        </div>

        <div class="input-group">
          <label class="input-label" for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="input-field"
            placeholder="Enter your email address"
            required
          >
        </div>

        <div class="input-group">
          <label class="input-label" for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="input-field"
            placeholder="Create a password"
            required
          >
        </div>

        <div class="input-group">
          <label class="input-label" for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            class="input-field"
            placeholder="Confirm your password"
            required
          >
        </div>

        <div class="input-group">
          <label class="input-label" for="referralCode">Referral Code (Optional)</label>
          <input
            type="text"
            id="referralCode"
            name="referralCode"
            class="input-field"
            placeholder="Enter referral code if you have one"
          >
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg">Sign Up</button>
      </form>

      <div class="auth-link">
        Already have an account? <a href="/signin.html">Sign in</a>
      </div>
    </div>
  </div>

  <script type="module" src="/js/signup.js"></script>
</body>
</html>
